    url: https://www.vlaio.be/nl/subsidies-financiering/subsidiedatabank/gewijzigde-maatregelen
  - name: Innoviris - programme calendar
    url: https://www.innoviris.brussels/program-calendar
  - name: Biovia - VLAIO funding calls
    url: https://www.biovia.be/vlaio-funding
  - name: Wallonia - competitiveness cluster calls
