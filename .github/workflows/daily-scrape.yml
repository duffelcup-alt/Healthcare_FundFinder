name: Daily funding check

on:
  schedule:
    - cron: "17 4 * * *"      # 05:17 Brussels time in winter, 06:17 in summer
  workflow_dispatch: {}       # "Run workflow" button for manual runs

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check sources
        id: scrape
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional; leave unset for rules-only mode
        run: python -m scraper.run --apply

      - name: Save scraper state (snapshots) straight to main
        run: |
          git config user.name "funding-bot"
          git config user.email "funding-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "scraper state $(date -u +%F) [skip ci]"
          git push

      - name: Rebuild site
        run: python site/build_site.py

      - name: Open a pull request with data changes and the report
        if: steps.scrape.outputs.has_news == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/daily-check
          delete-branch: true
          title: "Funding check ${{ github.run_id }}: changes found"
          commit-message: "Daily funding check"
          body-path: ${{ steps.scrape.outputs.report }}
          add-paths: |
            data/schemes.json
            reports/
            site/public/
          labels: daily-check
